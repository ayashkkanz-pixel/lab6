<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой любимый герой комиксов</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eeeeee;
            text-align: center;
            padding: 30px;
        }

        .hero {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
        }

        h1 {
            color: #d62828;
        }
    </style>
</head>

<body>

    <div class="hero">
        <h1>Человек-паук</h1>

        <h2>Мой любимый герой комиксов</h2>

        <p>
            Человек-паук — известный супергерой Marvel.
            Его настоящее имя — Питер Паркер.
        </p>

        <p>
            Он обладает сверхчеловеческой силой,
            ловкостью и способностью выпускать паутину.
        </p>

        <p>
            Мне нравится этот герой, потому что он
            смелый, добрый и всегда помогает людям.
        </p>
    </div>

</body>

</html>
